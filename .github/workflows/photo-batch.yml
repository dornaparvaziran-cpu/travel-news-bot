name: Dorna Telegram Photo Batch

on:
  repository_dispatch:
    types: [dorna_photo_batch]
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat ID for the batch
        required: true
        type: string
      file_ids:
        description: JSON array of Telegram photo file IDs (legacy/manual runs)
        required: true
        type: string

concurrency:
  group: dorna-telegram-photo-batch
  cancel-in-progress: false

jobs:
  process-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependencies
        run: pip install Pillow requests
      - name: Process Telegram photo batch
        env:
          PHOTO_BOT_TOKEN: ${{ secrets.PHOTO_BOT_TOKEN }}
          FRAME_URL: ${{ vars.FRAME_URL }}
          BATCH_FILE_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.file_ids || toJSON(github.event.client_payload.file_ids) }}
          BATCH_FILES: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.files) || '[]' }}
          BATCH_CHAT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.chat_id || github.event.client_payload.chat_id }}
          MAX_BATCH: "30"
          WEBP_QUALITY: "85"
        run: python telegram_batch_worker.py
