name: Dorna Telegram Photo Batch

on:
  repository_dispatch:
    types: [dorna_photo_batch]
  workflow_dispatch:

concurrency:
  group: dorna-telegram-photo-batch
  cancel-in-progress: false

jobs:
  process-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependencies
        run: pip install Pillow requests
      - name: Process Telegram photo batch
        env:
          PHOTO_BOT_TOKEN: ${{ secrets.PHOTO_BOT_TOKEN }}
          BATCH_FILE_IDS: ${{ toJSON(github.event.client_payload.file_ids) }}
          BATCH_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          MAX_BATCH: "30"
          WEBP_QUALITY: "85"
        run: python telegram_batch_worker.py
