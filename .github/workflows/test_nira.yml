name: Test Nira API

on:
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run Test
        env:
          NIRA_USER: ${{ secrets.NIRA_USER }}
          NIRA_PASS: ${{ secrets.NIRA_PASS }}
          NIRA_BASE_URL: ${{ secrets.NIRA_BASE_URL }}
        run: python test_nira.py
