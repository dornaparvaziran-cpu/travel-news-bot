
name: Test NIRA API

on:
  workflow_dispatch:

jobs:
  test-nira:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run NIRA test
        env:
          NIRA_USERNAME: ${{ secrets.NIRA_USER }}
          NIRA_PASSWORD: ${{ secrets.NIRA_PASS }}
        run: python test_nira.py
