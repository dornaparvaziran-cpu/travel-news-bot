name: Travel News Bot

on:
  schedule:
    # 🕘 ساعت ۹ صبح تهران (۵:۳۰ UTC) -> فقط اخبار
    - cron: '30 5 * * *'
    # 🕙 ساعت ۱۰ صبح تهران (۶:۳۰ UTC) -> فقط قیمت پروازها
    - cron: '30 6 * * *'
    # 🕔 ساعت ۵ عصر تهران (۱۳:۳۰ UTC) -> فقط اخبار
    - cron: '30 13 * * *'
    # 🕕 ساعت ۶ عصر تهران (۱۴:۳۰ UTC) -> فقط قیمت پروازها
    - cron: '30 14 * * *'
  workflow_dispatch: # برای اجرای دستی

jobs:
  # 📰 جاب مخصوص اخبار (ساعت ۹ صبح و ۵ عصر)
  run-news:
    if: github.event.schedule == '30 5 * * *' || github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run News
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          METIS_KEY: ${{ secrets.METIS_KEY }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}          # 👈 این خط باید باشد
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }} # 👈 و این خط
        run: python run_once.py news

  # ✈️ جاب مخصوص قیمت‌ها (ساعت ۱۰ صبح و ۶ عصر)
  run-prices:
    if: github.event.schedule == '30 6 * * *' || github.event.schedule == '30 14 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run Prices
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          METIS_KEY: ${{ secrets.METIS_KEY }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}          # 👈 این خط باید باشد
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }} # 👈 و این خط        
        run: python run_once.py prices
