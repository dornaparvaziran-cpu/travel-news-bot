name: Travel News Bot

concurrency:
  group: travel-bot-group
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      job_type:
        description: 'نوع جاب (news, prices, extras, destination, food, youtube, hotels)'
        required: true
        default: 'news'

jobs:
  run-news:
    if: github.event.inputs.job_type == 'news'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run News
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py news

  run-prices:
    if: github.event.inputs.job_type == 'prices'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run Prices
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py prices

  run-extras:
    if: github.event.inputs.job_type == 'extras'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run Extras
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py extras

  run-destination:
    if: github.event.inputs.job_type == 'destination'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run Destination
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py destination

  run-food:
    if: github.event.inputs.job_type == 'food'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run Food
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py food

  run-youtube:
    if: github.event.inputs.job_type == 'youtube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run YouTube
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python run_once.py youtube

  run-hotels:
    if: github.event.inputs.job_type == 'hotels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run Hotels
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py hotels
