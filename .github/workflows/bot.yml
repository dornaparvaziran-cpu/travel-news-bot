name: Travel News Bot

concurrency:
  group: travel-bot-group
  cancel-in-progress: false

on:
  schedule:
    # 🕘 ۹ صبح -> اخبار
    - cron: '30 5 * * *'
    # 🕙 ۱۰ صبح -> قیمت‌ها
    - cron: '30 6 * * *'
    # 🕛 ۱۲ ظهر -> آب‌وهوا، ارز و نکته روز
    - cron: '30 8 * * *'
    # 🕔 ۵ عصر -> اخبار
    - cron: '30 13 * * *'
    # 🕕 ۶ عصر -> قیمت‌ها
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  run-news:
    if: github.event.schedule == '30 5 * * *' || github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run News
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          METIS_KEY: ${{ secrets.METIS_KEY }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py news

  run-prices:
    if: github.event.schedule == '30 6 * * *' || github.event.schedule == '30 14 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run Prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          METIS_KEY: ${{ secrets.METIS_KEY }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py prices

  # 🌟 جاب جدید: موارد تکمیلی
  run-extras:
    if: github.event.schedule == '30 8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run Extras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py extras
