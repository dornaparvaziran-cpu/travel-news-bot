name: Travel News Bot

concurrency:
  group: travel-bot-group
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  run-news:
    if: github.event.schedule == '30 5 * * *' || github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 👇 این خط کشِ گیت‌هاب رو فعال می‌کنه تا فایل sent_links.txt پاک نشه
      - name: Cache sent links
        uses: actions/cache@v3
        with:
          path: sent_links.txt
          key: sent-links-cache

      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run News
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          METIS_KEY: ${{ secrets.METIS_KEY }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py news

  run-prices:
    if: github.event.schedule == '30 6 * * *' || github.event.schedule == '30 14 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 👇 برای قیمت‌ها هم کش می‌ذاریم تا تداخلی پیش نیاد
      - name: Cache sent links
        uses: actions/cache@v3
        with:
          path: sent_links.txt
          key: sent-links-cache

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run Prices
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          METIS_KEY: ${{ secrets.METIS_KEY }}
          EITA_TOKEN: ${{ secrets.EITA_TOKEN }}
          EITA_CHANNEL_ID: ${{ secrets.EITA_CHANNEL_ID }}
        run: python run_once.py prices
