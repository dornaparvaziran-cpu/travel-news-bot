
name: Test NIRA Fare

on:
  workflow_dispatch:

jobs:
  test-fare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Test NIRA Fare
        env:
          NIRA_USER: ${{ secrets.NIRA_USER }}
          NIRA_PASS: ${{ secrets.NIRA_PASS }}
        run: python test_nira_fare.py
