
name: Test NIRA AvailabilityFare

on:
  workflow_dispatch:

jobs:
  test-nira-fare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run AvailabilityFare test
        env:
          NIRA_USER: ${{ secrets.NIRA_USER }}
          NIRA_PASS: ${{ secrets.NIRA_PASS }}
        run: python test_nira_fare.py
