
name: Test NIRA Reservation

on:
  workflow_dispatch:
    inputs:
      confirm_reservation:
        description: "Type YES to authorize a real reservation"
        required: true
        type: choice
        options:
          - NO
          - YES

jobs:
  reserve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run reservation
        env:
          NIRA_USER: ${{ secrets.NIRA_USER }}
          NIRA_PASS: ${{ secrets.NIRA_PASS }}
          PASSENGER_FIRST_NAME: ${{ secrets.PASSENGER_FIRST_NAME }}
          PASSENGER_LAST_NAME: ${{ secrets.PASSENGER_LAST_NAME }}
          PASSENGER_AGE: ${{ secrets.PASSENGER_AGE }}
          PASSENGER_ID_FIELD: ${{ secrets.PASSENGER_ID_FIELD }}
          PASSENGER_CONTACT: ${{ secrets.PASSENGER_CONTACT }}
          RESERVE_CONFIRM: ${{ inputs.confirm_reservation }}
        run: python test_nira_reserve.py
